<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration - Student Portal</title>
  <link rel="stylesheet" href="submit_registration.css" />
</head>
<body>

  <!-- 🔙 Back Arrow -->
  <a href="dashboard.html" class="back-arrow" title="Back to Dashboard">⬅️</a>

  <!-- 🔷 Header -->
  <header class="academics-header">
    <h1 class="page-title">📝 Student Registration</h1>

    <!-- ☰ Hamburger Dropdown -->
  
  </header>

  <!-- 📝 Registration Form -->
  <section class="registration-section">
    <form action="submit_registration.php" method="POST" class="registration-form">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="course">Course:</label>
      <input type="text" id="course" name="course" required>

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>

      <label>
        <input type="checkbox" name="remember_me"> Remember Me
      </label>

      <button type="submit">Register</button>
    </form>
  </section>

</body>
</html>
